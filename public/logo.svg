    <path d="M48 184c0-13.3 10.7-24 24-24s24 10.7 24 24v8c0 4.4-3.6 8-8 8H56c-4.4 0-8-3.6-8-8v-8z" opacity="0.92"/>
    <!-- Bottom-right figure -->
    <circle cx="168" cy="148" r="20"/>
    <path d="M144 184c0-13.3 10.7-24 24-24s24 10.7 24 24v8c0 4.4-3.6 8-8 8h-32c-4.4 0-8-3.6-8-8v-8z" opacity="0.92"/>
    <!-- Connecting arcs -->
    <path d="M120 92C120 92 96 108 84 128" stroke="url(#fig)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M120 92C120 92 144 108 156 128" stroke="url(#fig)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M92 148C92 148 108 148 148 148" stroke="url(#fig)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>
