<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fig" x1="60" y1="40" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- Three community figures forming a circle -->
  <g fill="url(#fig)">
    <!-- Top figure -->
    <circle cx="120" cy="72" r="20"/>
    <path d="M96 108c0-13.3 10.7-24 24-24s24 10.7 24 24v8c0 4.4-3.6 8-8 8h-32c-4.4 0-8-3.6-8-8v-8z" opacity="0.92"/>
    <!-- Bottom-left figure -->
