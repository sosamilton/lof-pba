# docker-compose.yml — entorno PRODUCTIVO: Grist + LOF SPA
#
# Levanta Grist (backend + Redis + MinIO snapshots) y la SPA (frontend),
# listos para usar y 100% offline.
#
# Uso:
#   docker compose up -d --build       # construye la SPA y levanta todo
#   docker compose up -d               # usa imagen de GHCR si ya existe
#
# Puertos:
#   - Grist:         http://localhost:${GRIST_PORT:-8089}
#   - MinIO console: http://localhost:${MINIO_CONSOLE_PORT:-9001}
#   - LOF:           http://localhost:${APP_PORT:-8088}
#
# Persistencia (bind mounts en ./data/):
#   - ./data/grist/persist  — documento Grist (SQLite), usuarios, sesiones
#   - ./data/grist/docs     — documentos importados/exportados
#   - ./data/minio          — snapshots versionados (S3-compatible)
#
# Config: copiar docker/grist/grist.env.example a .env y personalizar.
# Ver docs/DOCKER.md para detalles.

include:
  - docker/grist/docker-compose.grist.yml

services:
  lof:
    image: ghcr.io/${IMAGE_REPO:-sosamilton/lof-pba}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lof
    ports:
      - "${APP_PORT:-8088}:80"
    restart: unless-stopped
