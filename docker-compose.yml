# docker-compose.yml — entorno PRODUCTIVO
# Sirve el build de la SPA con nginx. Imagen publicada en GHCR por el CI.
#
# Uso:
#   docker compose up -d              # usa la imagen de GHCR
#   docker compose up -d --build      # construye localmente si no hay imagen
#
# Ver docs/DOCKER.md para detalles.

services:
  appcoop:
    image: ghcr.io/${IMAGE_REPO:-sosamilton/spa-cooperadora}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appcoop
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
