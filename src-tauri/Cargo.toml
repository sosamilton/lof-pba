[package]
name = "lof"
version = "2.3.1"
description = "LOF — Gestión de cooperadoras escolares de PBA"
authors = ["Milton Sosa"]
edition = "2021"

[lib]
name = "lof_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
