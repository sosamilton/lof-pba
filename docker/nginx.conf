# Configuración de nginx para LOF SPA
# - Sirve estáticos desde /usr/share/nginx/html
# - Compresión gzip
# - Cache agresivo para assets con hash (inmutables)
# - Fallback a index.html para cualquier ruta no encontrada
#   (la SPA usa hash routing, pero el fallback cubre refresh y errores)

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Assets con hash de Vite: inmutables, cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # favicon y recursos públicos sin hash: cache moderado
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # grist-plugin-api.js: no cachear (es dependencia del widget)
    location = /grist-plugin-api.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # CSVs semilla: no cachear
    location /seeds/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # manifest.json: generado con envsubst en cada arranque del container (LOF_PUBLIC_URL)
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy a la API REST de Grist para evitar CORS desde el custom widget.
    # El widget se sirve desde este mismo origen (nginx), así que las llamadas
    # a /grist-api/ son same-origin. nginx las forwardea al backend de Grist.
    # El path se reescribe: /grist-api/api/docs/{docId}/attachments → /api/docs/{docId}/attachments
    #
    # Auth: el browser envía el access token como ?auth=<jwt> (formato que
    # Grist espera para access tokens de getAccessToken). nginx forwardea
    # el query string tal cual, sin convertir a header.
    #
    # Origin: el header X-Requested-With (necesario para CSRF de Grist en POST
    # con access tokens) dispara un preflight CORS del browser. Grist rechaza
    # requests cross-origin con credenciales. nginx strips el header Origin
    # para que Grist no vea el request como cross-origin.
    location /grist-api/ {
        proxy_pass http://grist:8484/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        # Multipart uploads pueden ser grandes
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Páginas pre-renderizadas + SPA fallback.
    # Las rutas públicas (sobre-lof, seguridad, etc.) tienen HTML estático
    # pre-renderizado con meta tags y contenido para SEO/sharing.
    # try_files prueba: $uri → $uri.html → $uri/ → index.html (SPA).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # No exponer archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
