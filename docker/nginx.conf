# Configuración de nginx para LOF SPA
# - Sirve estáticos desde /usr/share/nginx/html
# - Compresión gzip
# - Cache agresivo para assets con hash (inmutables)
# - Fallback a index.html para cualquier ruta no encontrada
#   (la SPA usa hash routing, pero el fallback cubre refresh y errores)

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Assets con hash de Vite: inmutables, cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # favicon y recursos públicos sin hash: cache moderado
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # grist-plugin-api.js: no cachear (es dependencia del widget)
    location = /grist-plugin-api.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # CSVs semilla: no cachear
    location /seeds/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No exponer archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
