    <noscript>
      <h1>LOF — Software libre para cooperadoras escolares PBA</h1>
      <p>LOF (Lazos que Organizan el Futuro) es una plataforma de software libre para gestionar cooperadoras escolares de la Provincia de Buenos Aires. Permite administrar socios, autoridades, tesorería, asambleas y generar la documentación oficial (PIA, Nómina) de forma digital y 100% offline.</p>
      <nav>
        <a href="#problemas">¿Qué resuelve?</a> | <a href="#funciones">Funciones</a> | <a href="#formas-uso">Formas de uso</a> | <a href="#datos">Cómo se guardan tus datos</a> | <a href="#faq">Preguntas frecuentes</a> | <a href="#contacto">Contacto</a>
      </nav>
      <h2 id="problemas">¿Qué resuelve LOF?</h2>
      <p>Las cooperadoras escolares de la Provincia de Buenos Aires enfrentan desafíos de gestión: cambio de comisión directiva cada año, libros obligatorios que se pierden, PIA que se arma a mano mes a mes. LOF resuelve estos problemas:</p>
      <ul>
        <li>Preserva la memoria institucional cuando cambia la comisión directiva</li>
        <li>Digitaliza los cuatro libros obligatorios de PBA: Actas, Socios, Tesorería e Inventario</li>
        <li>Genera la <a href="https://www.buenosaires.gob.ar/educacion/cooperadoras-escolares" rel="nofollow">PIA (Planilla de Ingresos y Aportes)</a> y la Nómina de autoridades automáticamente</li>
        <li>Tablero de caja con saldos en banco, efectivo y caja chica</li>
        <li>Padrón de socios con búsqueda instantánea por apellido, DNI o teléfono</li>
        <li>Gestión de autoridades con cálculo de vencimientos y alerta de quórum</li>
        <li>Asambleas AGO, AGE y RCD con resoluciones y padrón electoral</li>
        <li>Memoria anual exportable a PDF y DOC</li>
      </ul>
      <h2 id="funciones">Características principales</h2>
      <ul>
        <li>Software libre bajo <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="nofollow">AGPL-3.0</a> — sin costos, sin cuentas, telemetría respetuosa de tu privacidad</li>
        <li>100% offline: funciona sin internet, los datos se guardan en el dispositivo</li>
        <li>Alineado con el estatuto modelo y la PIA de la Provincia de Buenos Aires</li>
        <li>Tres formas de uso: navegador, respaldo local (Docker) o dentro de <a href="https://www.getgrist.com/" rel="nofollow">Grist</a></li>
        <li>App de escritorio para Windows, Linux y macOS</li>
        <li>Respaldo y migración de datos a un archivo .lof</li>
        <li>Accesible: navegación por teclado, lectores de pantalla y ARIA labels</li>
      </ul>
      <h2 id="formas-uso">Tres formas de usar LOF</h2>
      <p>LOF se puede usar de tres maneras, según las necesidades de cada cooperadora:</p>
      <ul>
        <li><strong>Navegador (PWA):</strong> se abre directamente en el navegador, sin instalar nada. Los datos se guardan en el dispositivo.</li>
        <li><strong>Docker / servidor local:</strong> para cooperadoras que quieren tener el sistema en una computadora de la escuela, con respaldo automático.</li>
        <li><strong>Grist:</strong> como widget personalizado dentro de <a href="https://www.getgrist.com/" rel="nofollow">Grist</a>, aprovechando la base de datos colaborativa.</li>
      </ul>
      <h2 id="datos">Cómo se guardan tus datos</h2>
      <p>Los datos de la cooperadora se guardan localmente en el navegador (IndexedDB) o en el servidor Grist de la escuela. Los datos no se suben a internet. Se puede exportar todo a un archivo .lof y migrar a otra computadora cuando haga falta. LOF no tiene acceso a los datos de ninguna cooperadora.</p>
      <h2 id="faq">Preguntas frecuentes sobre cooperadoras escolares y LOF</h2>
      <h3>¿LOF sirve para cooperadoras de la Provincia de Buenos Aires?</h3>
      <p>Sí, LOF está diseñado específicamente para las cooperadoras escolares de la Provincia de Buenos Aires. Está alineado con el estatuto modelo y la PIA de la DGCyE, y digitaliza los cuatro libros obligatorios que exige la <a href="https://www.buenosaires.gob.ar/educacion" rel="nofollow">Dirección General de Cultura y Educación de PBA</a>.</p>
      <h3>¿LOF es gratuito?</h3>
      <p>Sí, LOF es software libre bajo <a href="https://www.gnu.org/licenses/agpl-3.0.html" rel="nofollow">licencia AGPL-3.0</a>. No tiene costo ni requiere cuentas. Funciona offline y los datos son del usuario.</p>
      <h3>¿LOF genera la PIA automáticamente?</h3>
      <p>Sí. LOF consolida los movimientos del ejercicio y arma la PIA y la Nómina en PDF desde los datos cargados mes a mes.</p>
      <h3>¿Necesito internet para usar LOF?</h3>
      <p>No. LOF funciona 100% offline. Los datos se guardan en el navegador o en una computadora de la escuela.</p>
      <h3>¿LOF sirve para el control de la DIPREGEP?</h3>
      <p>Sí. Todos los registros son trazables y exportables. La PIA, la Nómina, el padrón de socios y las actas se generan en formato oficial, listos para cualquier control de la DIPREGEP.</p>

        <li><a href="https://lof.mdsoluciones.ar/#sobre-lof">Sobre LOF</a> — historia, significado del nombre y principios</li>
        <li><a href="https://lof.mdsoluciones.ar/#instalacion">Guía de instalación</a> — cómo empezar a usar LOF</li>
      </ul>
      <p>Para usar LOF, habilitá JavaScript en tu navegador. Más información en el <a href="https://github.com/sosamilton/lof-pba">repositorio de GitHub</a>.</p>
      <p><small>LOF es un proyecto independiente de software libre. No es una herramienta oficial de la DGCyE ni de la DIPREGEP, pero está alineado con el estatuto modelo y la normativa provincial.</small></p>
