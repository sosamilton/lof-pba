      <h1>LOF — Software libre para cooperadoras escolares de la Provincia de Buenos Aires</h1>
      <p>LOF (Lazos que Organizan el Futuro) es una plataforma de software libre para gestionar cooperadoras escolares de la Provincia de Buenos Aires. Permite administrar socios, autoridades, tesorería, asambleas y generar la documentación oficial (PIA, Nómina) de forma digital y 100% offline.</p>
      <h2>¿Qué resuelve LOF?</h2>
      <ul>
        <li>Preserva la memoria institucional cuando cambia la comisión directiva</li>
        <li>Digitaliza los cuatro libros obligatorios de PBA: Actas, Socios, Tesorería e Inventario</li>
        <li>Genera la PIA (Planilla de Ingresos y Aportes) y la Nómina de autoridades automáticamente</li>
        <li>Tablero de caja con saldos en banco, efectivo y caja chica</li>
        <li>Padrón de socios con búsqueda instantánea por apellido, DNI o teléfono</li>
        <li>Gestión de autoridades con cálculo de vencimientos y alerta de quórum</li>
        <li>Asambleas AGO, AGE y RCD con resoluciones y padrón electoral</li>
        <li>Memoria anual exportable a PDF y DOC</li>
      </ul>
      <h2>Características principales</h2>
      <ul>
        <li>Software libre bajo AGPL-3.0 — sin costos, sin cuentas, sin telemetría</li>
        <li>100% offline: funciona sin internet, los datos se guardan en el dispositivo</li>
        <li>Alineado con el estatuto modelo y la PIA de la Provincia de Buenos Aires</li>
        <li>Tres formas de uso: navegador, respaldo local (Docker) o dentro de Grist</li>
        <li>App de escritorio para Windows, Linux y macOS</li>
        <li>Respaldo y migración de datos a un archivo .lof</li>
        <li>Accesible: navegación por teclado, lectores de pantalla y ARIA labels</li>
      </ul>
      <h2>Preguntas frecuentes sobre cooperadoras escolares y LOF</h2>
      <h3>¿LOF sirve para cooperadoras de la Provincia de Buenos Aires?</h3>
      <p>Sí, LOF está diseñado específicamente para las cooperadoras escolares de la Provincia de Buenos Aires. Está alineado con el estatuto modelo y la PIA de la DGCyE.</p>
      <h3>¿LOF es gratuito?</h3>
      <p>Sí, LOF es software libre bajo AGPL-3.0. No tiene costo ni requiere cuentas. Funciona offline y los datos son del usuario.</p>
      <h3>¿LOF genera la PIA automáticamente?</h3>
      <p>Sí. LOF consolida los movimientos del ejercicio y arma la PIA y la Nómina en PDF desde los datos cargados mes a mes.</p>
      <h3>¿Necesito internet para usar LOF?</h3>
      <p>No. LOF funciona 100% offline. Los datos se guardan en el navegador o en una computadora de la escuela.</p>
      <p>Para usar LOF, habilitá JavaScript en tu navegador. Más información en el <a href="https://github.com/sosamilton/lof-pba">repositorio de GitHub</a>.</p>
